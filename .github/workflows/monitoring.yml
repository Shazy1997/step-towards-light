name: Project Monitoring

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test
      
      - name: Check Docker
        run: |
          docker --version
          docker-compose --version
      
      - name: Update progress tracking
        run: |
          npm run update-progress
          
      - name: Check for outdated dependencies
        run: npm outdated || true
      
      - name: Generate monitoring summary
        run: |
          echo "## Monitoring Summary ($(date))" > monitoring.md
          echo "### Test Results" >> monitoring.md
          npm test 2>&1 | tee -a monitoring.md
          echo "### Dependencies Status" >> monitoring.md
          npm outdated --json | jq . || echo "{}" | jq . >> monitoring.md
          echo "### Docker Status" >> monitoring.md
          docker info >> monitoring.md || echo "Docker not available" >> monitoring.md
      
      - name: Upload monitoring results
        uses: actions/upload-artifact@v3
        with:
          name: monitoring-report
          path: |
            monitoring.md
            PROGRESS.md
            scripts/monitoring/docker-status.json
            scripts/repo-analysis/report.json
      
      - name: Create or update monitoring report
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            git config --global user.name 'GitHub Action'
            git config --global user.email 'action@github.com'
            cp monitoring.md MONITORING_LATEST.md
            git add MONITORING_LATEST.md PROGRESS.md scripts/monitoring/docker-status.json scripts/repo-analysis/report.json
            git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Update monitoring reports [skip ci]" && git push)
          fi

  notify:
    needs: monitor
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify about monitoring failure
        run: |
          echo "Monitoring job failed. Add notification logic here."
          # Add your preferred notification method (e.g., Discord webhook, email, etc.)
